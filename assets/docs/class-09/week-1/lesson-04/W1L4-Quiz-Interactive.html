<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>W1L4 Interactive Quiz ? Dalswin</title><style>body{font:16px/1.6 Arial,sans-serif;color:#173b29;background:#faf7ef;max-width:800px;margin:2rem auto;padding:1rem}header{border-bottom:4px solid #f2a91c;padding-bottom:1rem}h1{font-size:2rem}button{padding:.7rem 1.1rem;background:#0a4027;color:white;border:0;border-radius:6px;font-weight:bold;cursor:pointer}fieldset{border:1px solid #b9c9ba;border-radius:8px;margin:1rem 0;padding:1rem}label{display:block;padding:.3rem}#feedback{font-weight:bold}small{color:#526258}</style><header><small>DALSWIN LIFE &amp; BUSINESS INSTITUTE ? CLASS 09</small><h1>Lesson 4 Quiz</h1><p>Mouse, keyboard, typing &amp; shortcuts ? 10 marks</p></header><main><p>This standalone quiz works offline in a modern browser. Choose one answer for each question, then submit.</p><form id="f"></form><button id="submit">Submit answers</button><p id="feedback" aria-live="polite"></p><button id="again" hidden>Try again</button></main><script>const Q=[{"q": "Which action usually opens a desktop icon?", "o": ["Click once", "Double-click", "Right-click", "Scroll"], "a": 1, "w": "A double-click on a desktop icon opens it. A single click usually selects it."}, {"q": "Which action usually shows options for a selected file?", "o": ["Double-click", "Scroll", "Right-click", "Press Enter"], "a": 2, "w": "Right-click opens a context menu for the item."}, {"q": "What does dragging and dropping do?", "o": ["Moves an item while holding the mouse button", "Opens a context menu", "Deletes the screen", "Types a space"], "a": 0, "w": "Hold the button, move the pointer, and release to place the selected item."}, {"q": "Which key removes the character before the cursor?", "o": ["Delete", "Backspace", "Shift", "Tab"], "a": 1, "w": "Backspace removes the character immediately before the insertion point."}, {"q": "How do you make one letter uppercase while typing?", "o": ["Caps Lock only", "Shift with the letter", "Alt with the letter", "Tab with the letter"], "a": 1, "w": "Hold Shift while pressing a letter for one capital letter."}, {"q": "What does Ctrl + C usually do?", "o": ["Cut selected content", "Paste content", "Copy selected content", "Undo"], "a": 2, "w": "Copy places a copy on the clipboard and leaves the original in place."}, {"q": "Which shortcut usually saves the current document?", "o": ["Ctrl + P", "Ctrl + S", "Ctrl + A", "Alt + Tab"], "a": 1, "w": "Ctrl + S saves the active file in many Windows applications."}, {"q": "What does Alt + Tab help you do?", "o": ["Switch between open windows", "Lock the computer", "Select all text", "Open the print dialog"], "a": 0, "w": "Alt + Tab cycles between open application windows."}, {"q": "Why proofread names and amounts after typing?", "o": ["To make the font larger", "To catch errors before they affect workplace records", "To lock the keyboard", "To open the context menu"], "a": 1, "w": "A typo in a name, date or amount can cause confusion or inaccurate records."}, {"q": "What is a good typing habit?", "o": ["Press keys as hard as possible", "Type as fast as possible without checking", "Use a relaxed posture and prioritise accuracy", "Keep wrists bent while typing"], "a": 2, "w": "A relaxed posture and careful practice support comfort and accuracy."}];const f=document.querySelector('#f');function draw(){f.innerHTML=Q.map((x,i)=>'<fieldset><legend><b>'+String(i+1)+'. '+x.q+'</b></legend>'+x.o.map((v,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+v+'</label>').join('')+'</fieldset>').join('');document.querySelector('#feedback').textContent='';document.querySelector('#again').hidden=true;document.querySelector('#submit').hidden=false}document.querySelector('#submit').onclick=()=>{let score=0,missing=0;Q.forEach((x,i)=>{const s=f.querySelector('input[name=q'+i+']:checked');if(!s)missing++;else if(+s.value===x.a)score++});if(missing){document.querySelector('#feedback').textContent='Please answer all '+missing+' remaining question(s), then submit.';return}document.querySelector('#feedback').textContent='Score: '+score+'/10. '+(score>=8?'Target reached. Review the explanations below.':'Review the explanations and try again.');Q.forEach((x,i)=>{let p=document.createElement('p');p.innerHTML='<b>'+(i+1)+'. Correct answer: '+x.o[x.a]+'.</b> '+x.w;f.appendChild(p)});document.querySelector('#submit').hidden=true;document.querySelector('#again').hidden=false};document.querySelector('#again').onclick=draw;draw()</script></html>
