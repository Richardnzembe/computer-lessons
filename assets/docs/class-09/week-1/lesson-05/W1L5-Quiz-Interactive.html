<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lesson 5 Quiz · Dalswin Institute</title><style>body{max-width:850px;margin:25px auto;padding:0 18px;color:#20342a;font:16px/1.6 Arial;background:#faf9f4}header{background:#0a4027;color:white;padding:28px;border-radius:16px}h1{margin:5px 0}article{background:white;border:1px solid #d9dfd8;border-radius:12px;padding:17px;margin:14px 0}label{display:block;margin:7px 0}.btn{background:#e3a321;border:0;border-radius:7px;padding:12px 18px;font-weight:bold;cursor:pointer}.why{color:#0a4027;font-size:.94em}</style><header><small>DALSWIN LIFE &amp; BUSINESS INSTITUTE · CLASS 09 · WEEK 1</small><h1>Lesson 5 · Files, folders &amp; documents</h1><p>10 questions · 10 marks · Suggested time: 10 minutes. Select one answer for each item, submit and review feedback.</p></header><main id="quiz"></main><button class="btn" onclick="grade()">Submit answers</button> <b id="score" aria-live="polite"></b><script>const Q=[{"q": "What is a folder mainly used for?", "options": ["To group files and related folders", "To type a document", "To print a page", "To connect to Wi-Fi"], "answer": 0, "why": "A folder is a container for organising files and subfolders."}, {"q": "Which item is a file?", "options": ["Work Documents", "Letters", "Meeting_Notes.docx", "Reports"], "answer": 2, "why": "A document with a filename and extension is a file."}, {"q": "Where should Reports, Letters and Presentations go in this lesson?", "options": ["Inside Work Documents", "Inside the Recycle Bin", "On the desktop only", "Inside the browser"], "answer": 0, "why": "The three categories are subfolders of Work Documents."}, {"q": "Which command is appropriate for saving a new document to a chosen folder?", "options": ["File > Save As", "Delete", "Refresh", "Print Screen"], "answer": 0, "why": "Save As lets you choose the name, format and destination for a new file."}, {"q": "What does Ctrl + S usually do after a document has been saved once?", "options": ["Saves changes to the current document", "Creates three folders", "Renames the folder", "Opens File Explorer"], "answer": 0, "why": "Ctrl + S saves changes to the active file."}, {"q": "Which is the clearest filename for a client welcome letter?", "options": ["new final", "Document1", "Client_Welcome_Letter_2026-11-21", "letter!!!"], "answer": 2, "why": "A descriptive, consistent name helps people identify and retrieve the file."}, {"q": "What should you do after moving or renaming a file?", "options": ["Confirm its new name and location", "Immediately empty the Recycle Bin", "Assume it is correct", "Turn off the computer"], "answer": 0, "why": "Verify the item is where expected and opens correctly."}, {"q": "Which shortcut commonly renames a selected item in File Explorer?", "options": ["F2", "Ctrl + P", "Alt + Tab", "Windows + L"], "answer": 0, "why": "F2 commonly starts renaming the selected file or folder."}, {"q": "What is a safe item for deletion practice?", "options": ["A temporary practice file you created", "A shared staff record", "A system folder", "A colleague’s report"], "answer": 0, "why": "Use only a harmless file you own or have permission to remove."}, {"q": "How can you search for a saved file if you know part of its name?", "options": ["Use File Explorer search", "Create a second copy", "Empty the Recycle Bin", "Change the file extension"], "answer": 0, "why": "Search with a distinctive name, then confirm the location of the result."}];Q.forEach((x,i)=>{let a=document.createElement('article');a.innerHTML='<b>'+(i+1)+'. '+x.q+'</b>'+x.options.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+o+'</label>').join('')+'<p class="why" id="w'+i+'"></p>';document.getElementById('quiz').append(a)});function grade(){let n=0;Q.forEach((x,i)=>{let v=document.querySelector('input[name=q'+i+']:checked');if(v&&+v.value===x.answer)n++;document.getElementById('w'+i).textContent=(v&&+v.value===x.answer?'Correct. ':'Review. ')+x.why});document.getElementById('score').textContent='Score: '+n+'/10'+(n>=8?' · Good work.':' · Review feedback and retry.');}</script></main></html>
