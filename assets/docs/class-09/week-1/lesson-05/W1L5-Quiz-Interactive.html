<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lesson 5 quiz - Dalswin Institute</title><style>body{max-width:850px;margin:30px auto;padding:0 18px;color:#20342a;font:16px/1.6 Arial,sans-serif;background:#faf9f4}header{background:#0a4027;color:white;padding:28px;border-radius:16px}article{background:white;border:1px solid #d9dfd8;border-radius:12px;padding:18px;margin:14px 0}label{display:block;margin:8px 0}.btn{background:#e3a321;border:0;border-radius:7px;padding:12px 18px;font-weight:bold;cursor:pointer}.why{color:#0a4027}</style></head><body><header><small>DALSWIN LIFE &amp; BUSINESS INSTITUTE &middot; CLASS 09 &middot; WEEK 1</small><h1>Lesson 5 &middot; Files, folders &amp; documents</h1><p>10 questions &middot; 10 marks &middot; Suggested time: 10 minutes. Select one answer per question, submit and review the explanations.</p></header><main id="quiz"></main><button class="btn" onclick="grade()">Submit answers</button> <b id="score" aria-live="polite"></b><script>const Q=[{q:"What is a folder mainly used for?",options:["Grouping files and related folders","Typing a document","Printing a page","Connecting to Wi-Fi"],answer:0,why:"A folder is a container that groups files and other folders."},{q:"Which item is a file?",options:["Work Documents","Letters","Meeting_Notes.docx","Reports"],answer:2,why:"Meeting_Notes.docx is a saved document file."},{q:"Where should Reports, Letters and Presentations be created?",options:["Inside Work Documents","Inside Recycle Bin","Inside a browser","Only on the desktop"],answer:0,why:"The three categories are subfolders of Work Documents."},{q:"Which command is best for saving a new document to a chosen folder?",options:["File > Save As","Delete","Refresh","Print Screen"],answer:0,why:"Save As lets you choose the new file name and destination."},{q:"What does Ctrl+S usually do after the first save?",options:["Save changes to the current file","Create a folder","Rename a folder","Open File Explorer"],answer:0,why:"Ctrl+S saves changes to the active document in many programs."},{q:"Which is the clearest filename for a client welcome letter?",options:["new final","Document1","Client_Welcome_Letter_2026-11-21","letter!!!"],answer:2,why:"A descriptive name and consistent date make retrieval easier."},{q:"What should you do after moving or renaming a file?",options:["Confirm the new name and location","Empty Recycle Bin","Assume it worked","Shut down immediately"],answer:0,why:"Verify the item is where expected and opens correctly."},{q:"Which key commonly starts renaming a selected File Explorer item?",options:["F2","Ctrl+P","Alt+Tab","Windows+L"],answer:0,why:"F2 commonly starts renaming the selected file or folder."},{q:"Which item is safe for deletion practice?",options:["A temporary file you created","A shared staff record","A system folder","A colleague report"],answer:0,why:"Practise only on a harmless item you own or have permission to delete."},{q:"You know part of a saved filename but not the folder. What should you do?",options:["Use File Explorer search, then verify its path","Create another copy","Empty Recycle Bin","Change its extension"],answer:0,why:"Search by a distinctive word, then confirm the location before opening it."}];Q.forEach((x,i)=>{let a=document.createElement('article');a.innerHTML='<b>'+(i+1)+'. '+x.q+'</b>'+x.options.map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+o+'</label>').join('')+'<p class="why" id="w'+i+'"></p>';document.getElementById('quiz').append(a)});function grade(){let n=0;Q.forEach((x,i)=>{let v=document.querySelector('input[name="q'+i+'"]:checked');if(v&&+v.value===x.answer)n++;document.getElementById('w'+i).textContent=(v&&+v.value===x.answer?'Correct. ':'Review. ')+x.why});document.getElementById('score').textContent='Score: '+n+'/10. '+(n>=8?'Good work.':'Review the explanations and retry.');}</script></body></html>
